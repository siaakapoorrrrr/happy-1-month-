<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 1 Month ♡ — Love Letter</title>
  <meta name="description" content="A cute interactive pixel-art love letter celebrating one month of marriage. Open the envelope and answer the question." />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="./love.css" />
</head>
<body>
  <!-- atmospheric background -->
  <div class="fx" aria-hidden="true">
    <div class="fx__aurora"></div>
    <div class="fx__vignette"></div>
    <div class="fx__grain"></div>
  </div>

  <!-- celebration hearts-rain layer (filled by JS on win) -->
  <div class="rain" id="rain" aria-hidden="true"></div>

  <!-- falling-flower-petal layer, used for gentle transitions between sections -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="scene">
    <!-- Heart confetti layer (parallax depth, filled by JS) -->
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <!-- STATE 1: shoot Cupid's arrow at the letter to open it -->
    <div class="stage stage--aim" id="aimStage" tabindex="0" role="application"
         aria-label="Aim and shoot Cupid's arrow at the letter to open it. Press space to shoot.">

      <!-- floating target: the closed envelope -->
      <div class="target" id="target">
        <div class="envelope" aria-hidden="true">
          <span class="envelope__flap"></span>
          <span class="heart envelope__seal"></span>
        </div>
        <p class="target__label">
          <span class="heart heart--inline"></span>
          Happy 1 Month
          <span class="heart heart--inline"></span>
        </p>
      </div>

      <!-- the flying arrow -->
      <div class="arrow" id="arrow" aria-hidden="true"></div>

      <!-- the bow -->
      <div class="archer" id="archer" aria-hidden="true">
        <div class="bow" id="bow"></div>
        <span class="nock" id="nock"></span>
      </div>

      <p class="hint" id="hint">
        <span id="hintText">Aim &amp; release to shoot Cupid&rsquo;s arrow</span>
        <span class="heart heart--inline"></span>
      </p>
    </div>

    <!-- STATE 2: opened "LOVE" window -->
    <section class="window" id="window" aria-hidden="true">
      <header class="titlebar">
        <span class="titlebar__name">LOVE</span>
        <span class="titlebar__btns">
          <button class="winbtn" type="button" aria-label="Minimize" tabindex="-1">&#95;</button>
          <button class="winbtn" type="button" aria-label="Maximize" tabindex="-1">&#9633;</button>
          <button class="winbtn winbtn--x" type="button" id="closeBtn" aria-label="Close letter">&#10005;</button>
        </span>
      </header>

      <div class="heartrow" aria-hidden="true">
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span>
      </div>

      <div class="content" id="content">
        <h1 class="title" id="title">Happy 1 month Siaaaa ♡, Do you still love me?</h1>
        <canvas class="cat" id="cat" width="16" height="16" aria-label="A little cat holding a heart" role="img"></canvas>
        <div class="buttons" id="buttons">
          <button class="btn btn--yes" type="button" id="yesBtn">YES</button>
          <button class="btn btn--no"  type="button" id="noBtn">NO</button>
        </div>
        <p class="final" id="final" hidden>
          One month down, a <mark>lifetime</mark> to go.
          Happy anniversary, my love
          <span class="heart heart--inline"></span>
        </p>
        <button class="btn btn--next" type="button" id="toLetterBtn" hidden>Read my letter &rarr;</button>
      </div>
    </section>

    <!-- STATE 3: hand-written letter, typed out letter by letter -->
    <section class="window window--letter" id="letterStage" aria-hidden="true">
      <header class="titlebar">
        <span class="titlebar__name">LETTER.txt</span>
        <span class="titlebar__btns">
          <button class="winbtn" type="button" aria-label="Minimize" tabindex="-1">&#95;</button>
          <button class="winbtn" type="button" aria-label="Maximize" tabindex="-1">&#9633;</button>
          <button class="winbtn winbtn--x" type="button" id="letterCloseBtn" aria-label="Close letter">&#10005;</button>
        </span>
      </header>

      <div class="heartrow" aria-hidden="true">
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span>
      </div>

      <div class="content content--letter">
        <p class="letter__paper" id="letterPaper">
          <span id="letterType"></span><span class="letter__cursor" id="letterCursor" aria-hidden="true"></span>
        </p>
        <button class="btn btn--skip" type="button" id="letterSkipBtn">Skip &raquo;</button>
        <button class="btn btn--next" type="button" id="toPhotosBtn" hidden>My Favorite Memories &rarr;</button>
      </div>
    </section>

    <!-- STATE 4: photobooth — photos pinned to a rope -->
    <section class="window window--photos" id="photoStage" aria-hidden="true">
      <header class="titlebar">
        <span class="titlebar__name">PHOTOBOOTH</span>
        <span class="titlebar__btns">
          <button class="winbtn" type="button" aria-label="Minimize" tabindex="-1">&#95;</button>
          <button class="winbtn" type="button" aria-label="Maximize" tabindex="-1">&#9633;</button>
          <button class="winbtn winbtn--x" type="button" id="photoCloseBtn" aria-label="Close letter">&#10005;</button>
        </span>
      </header>

      <div class="heartrow" aria-hidden="true">
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span>
      </div>

      <div class="content content--photos">
        <p class="photos__intro">A little rope of us <span class="heart heart--inline"></span></p>
        <div class="clothesline-wrap">
          <div class="rope" aria-hidden="true"></div>
          <div class="clothesline" id="clothesline" role="list" aria-label="Photos of us"></div>
        </div>
        <button class="btn btn--replay" type="button" id="replayBtn">Replay &#9825;</button>
      </div>
    </section>
  </main>

  <!-- scratch-card modal: click a photo on the rope to open it here -->
  <div class="scratch-modal" id="scratchModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Scratch to reveal the photo">
    <div class="scratch-modal__backdrop" id="scratchBackdrop"></div>
    <div class="scratch-card">
      <button class="winbtn winbtn--x scratch-card__close" type="button" id="scratchCloseBtn" aria-label="Close photo">&#10005;</button>
      <div class="scratch-card__frame" id="scratchFrame">
        <img class="scratch-card__img" id="scratchImg" alt="" />
        <canvas class="scratch-card__canvas" id="scratchCanvas"></canvas>
        <p class="scratch-card__hint" id="scratchHint">Scratch to<br />reveal <span class="heart heart--inline"></span></p>
      </div>
      <p class="scratch-card__caption" id="scratchCaption"></p>
      <button class="btn btn--skip scratch-card__reveal" type="button" id="scratchRevealBtn">Reveal instead &raquo;</button>
    </div>
  </div>

  <script src="./love.js"></script>
</body>
</html>
